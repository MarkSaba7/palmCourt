# Publishes the game to GitHub Pages on every push to main (or by hand from the Actions tab).
# Repository Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A syntax error in any module leaves the page stuck on the loading screen, so don't publish one.
      - name: Check every module parses
        run: |
          for f in $(find src -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      # Only what the browser needs: the game, the phone racket page, the privacy and credits pages and the modules
      # (no serve.py, tests or notes).
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html controller.html privacy.html credits.html _site/
          cp -r src _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
