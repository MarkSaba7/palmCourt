# Publishes the website and the game to GitHub Pages on every push to main (or by hand from the Actions tab).
# Repository Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A syntax error in any module leaves the page stuck on the loading screen, so don't publish one.
      - name: Check every module parses
        run: |
          for f in racket-sw.js $(find src site tools -name '*.js' -o -name '*.mjs'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - id: pages
        uses: actions/configure-pages@v5
      # Only what the browser needs: the website pages, the game (play/ + src/), the phone racket app (controller.html,
      # racket.webmanifest, racket-sw.js, site/racket-*) and the site assets (no serve.py, tests, docs or notes). tools/build-site.mjs also fills in the site settings from
      # site/config.mjs; repository variables with the same names override them (Settings → Secrets and variables →
      # Actions → Variables). Until there's a domain the site uses its Pages address (PAGES_URL). See docs/PUBLISHING.md.
      - name: Build the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          AD_SLOT: ${{ vars.AD_SLOT }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          STEAM_URL: ${{ vars.STEAM_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node tools/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
